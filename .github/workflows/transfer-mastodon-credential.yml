name: Transfer Mastodon credential securely
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Ephemeral RSA public key of the authorized local operator
        required: true
        type: string
      transfer_id:
        description: Unique identifier for this credential transfer
        required: true
        type: string
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Encrypt only the Mastodon credential for the local operator
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          TRANSFER_ID: ${{ inputs.transfer_id }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { sealCredential } from './src/modules/publishing/credential-transfer.mjs';
          const sealed = sealCredential({ publicKey: process.env.PUBLIC_KEY,
            value: process.env.MASTODON_ACCESS_TOKEN, transferId: process.env.TRANSFER_ID });
          await writeFile('sealed-mastodon.json', JSON.stringify(sealed));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-mastodon-${{ inputs.transfer_id }}
          path: sealed-mastodon.json
          if-no-files-found: error
          retention-days: 1
