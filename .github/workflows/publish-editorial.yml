name: Publish Instagram editorial guide

on:
  schedule:
    - cron: '17 15 * * 1,3,5'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - controlled
      content_id:
        description: Editorial content ID for review or controlled publication
        required: false
        type: string
      confirmation:
        description: Enter PUBLISH_ONE_EDITORIAL_POST for a controlled publication
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: social-publisher-publication
  cancel-in-progress: false

jobs:
  publish-editorial:
    if: github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      WEB_PATH: dependencies/web
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://openings.dev' }}
      WEB_DEPLOY_REPOSITORY: ${{ vars.WEB_DEPLOY_REPOSITORY || 'openings-dev/web-deploy' }}
      INSTAGRAM_API_ORIGIN: ${{ vars.INSTAGRAM_API_ORIGIN || 'https://graph.instagram.com' }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      INSTAGRAM_EDITORIAL_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled') && 'true' || vars.INSTAGRAM_EDITORIAL_AUTO_PUBLISH || 'false' }}
      EDITORIAL_OPERATION_KEY: editorial-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out social-publisher state and source
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check out the canonical openings.dev wordmark
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: openings-dev/web
          path: dependencies/web
          persist-credentials: false

      - name: Use Node.js 20
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install rendering tools
        run: sudo apt-get update && sudo apt-get install --yes fonts-noto-cjk imagemagick librsvg2-bin

      - name: Install exact dependencies
        run: npm ci

      - name: Validate the controlled editorial gate
        if: github.event_name == 'workflow_dispatch' && env.RUN_MODE == 'controlled'
        env:
          REQUEST_CONTENT_ID: ${{ inputs.content_id }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module - <<'NODE'
          import { parseEditorialRequest } from './src/cli/editorial.mjs';
          parseEditorialRequest({
            mode: 'controlled',
            contentId: process.env.REQUEST_CONTENT_ID || undefined,
            confirmation: process.env.REQUEST_CONFIRMATION || undefined,
          });
          NODE

      - name: Render editorial review without external writes
        if: github.event_name == 'workflow_dispatch' && env.RUN_MODE == 'dry-run'
        env:
          REQUEST_CONTENT_ID: ${{ inputs.content_id }}
        run: |
          arguments=(--mode dry-run --wordmark "$WEB_PATH/public/openings-wordmark-light.svg" --output .tmp/editorial-review)
          if [[ -n "$REQUEST_CONTENT_ID" ]]; then arguments+=(--content "$REQUEST_CONTENT_ID"); fi
          npm run editorial -- "${arguments[@]}"

      - name: Upload editorial review
        if: github.event_name == 'workflow_dispatch' && env.RUN_MODE == 'dry-run'
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editorial-review-${{ github.run_id }}
          path: .tmp/editorial-review/editorial/**
          if-no-files-found: error
          retention-days: 3

      - name: Enqueue one editorial guide
        if: (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true'
        env:
          REQUEST_CONTENT_ID: ${{ inputs.content_id }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$RUN_MODE" == 'controlled' ]]; then
            npm run editorial -- --mode controlled --content "$REQUEST_CONTENT_ID" --confirmation "$REQUEST_CONFIRMATION" --state state
          else
            npm run editorial -- --mode enqueue --state state
          fi

      - name: Commit editorial intent
        if: (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/editorial.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record editorial intent [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy editorial assets
        id: editorial_assets
        if: (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true'
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: npm run editorial -- --mode assets --state state --wordmark "$WEB_PATH/public/openings-wordmark-light.svg"

      - name: Commit editorial asset result
        if: always() && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_assets.outcome != 'skipped'
        run: |
          git add -- state/editorial.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record editorial assets [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish editorial carousel
        id: editorial_feed
        if: (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_assets.outcome == 'success'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: npm run editorial -- --mode feed --state state

      - name: Commit editorial feed result
        if: always() && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_feed.outcome != 'skipped'
        run: |
          git add -- state/editorial.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record editorial feed [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Prepare editorial Story intent
        id: editorial_story_intent
        if: (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_feed.outcome == 'success'
        run: npm run editorial -- --mode story-intent --state state

      - name: Commit editorial Story intent
        if: always() && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_story_intent.outcome != 'skipped'
        run: |
          git add -- state/editorial.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record editorial Story intent [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish editorial Story
        id: editorial_story
        if: (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_story_intent.outcome == 'success'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: npm run editorial -- --mode story --state state

      - name: Commit editorial Story result
        if: always() && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_EDITORIAL_AUTO_PUBLISH == 'true' && steps.editorial_story.outcome != 'skipped'
        run: |
          git add -- state/editorial.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record editorial Story [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
