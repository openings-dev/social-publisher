name: Publish social jobs

on:
  repository_dispatch:
    types: [openings_source_committed_v1]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - controlled
          - migrate-meta
          - retry-stage
          - scheduled
      job_id:
        description: Explicit gh_ job ID for controlled publication or reset
        required: false
        type: string
      job_ids:
        description: Comma-separated gh_ job IDs for a Meta visual migration
        required: false
        type: string
      stage:
        description: Failed stage to reset
        required: false
        default: mastodon
        type: choice
        options:
          - bridge
          - intake-bridge
          - bluesky
          - mastodon
          - twitter
          - threads
          - instagram
          - linkedin
          - instagramStory
      confirmation:
        description: Enter PUBLISH_ONE_JOB, RESET_FAILED_STAGE, or MIGRATE_META_POSTS
        required: false
        type: string
      publish_meta:
        description: Include Instagram and Threads in this controlled publication only
        required: false
        default: false
        type: boolean
      publish_linkedin:
        description: Include LinkedIn in this controlled publication only
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: social-publisher-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Intake and publish one job
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_PATH: ${{ secrets.DATA_PATH }}
      WEB_PATH: ${{ secrets.WEB_PATH }}
      PUBLIC_SITE_ORIGIN: ${{ secrets.PUBLIC_SITE_ORIGIN }}
      WEB_DEPLOY_REPOSITORY: ${{ secrets.WEB_DEPLOY_REPOSITORY }}
      BLUESKY_SERVICE_URL: ${{ secrets.BLUESKY_SERVICE_URL }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      THREADS_API_URL: ${{ secrets.THREADS_API_URL }}
      INSTAGRAM_API_ORIGIN: ${{ secrets.INSTAGRAM_API_ORIGIN }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      LINKEDIN_API_ORIGIN: ${{ secrets.LINKEDIN_API_ORIGIN }}
      LINKEDIN_API_VERSION: ${{ secrets.LINKEDIN_API_VERSION }}
      LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
      LINKEDIN_PROVIDER: ${{ secrets.LINKEDIN_PROVIDER }}
      BUFFER_API_ORIGIN: ${{ secrets.BUFFER_API_ORIGIN }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
      BUFFER_TWITTER_CHANNEL_ID: ${{ secrets.BUFFER_TWITTER_CHANNEL_ID }}
      SOCIAL_AUTO_PUBLISH: ${{ secrets.SOCIAL_AUTO_PUBLISH }}
      PUBLISHING_SOCIAL_SHADOW_ENABLED: ${{ secrets.PUBLISHING_SOCIAL_SHADOW_ENABLED }}
      PUBLISHING_MASTODON_ENABLED: ${{ secrets.PUBLISHING_MASTODON_ENABLED }}
      PUBLISHING_ENDPOINT: ${{ secrets.PUBLISHING_ENDPOINT }}
      PUBLISHING_CLIENT_ID: ${{ secrets.PUBLISHING_CLIENT_ID }}
      OPENINGS_R2_ENABLED: ${{ secrets.OPENINGS_R2_ENABLED }}
      OPENINGS_R2_ACCOUNT_ID: ${{ secrets.OPENINGS_R2_ACCOUNT_ID }}
      OPENINGS_R2_BUCKET: ${{ secrets.OPENINGS_R2_BUCKET }}
      OPENINGS_R2_BUCKET_PURPOSE: ${{ secrets.OPENINGS_R2_BUCKET_PURPOSE }}
      OPENINGS_R2_PUBLIC_ORIGIN: ${{ secrets.OPENINGS_R2_PUBLIC_ORIGIN }}
      OPENINGS_R2_CAPACITY_JSON: ${{ secrets.OPENINGS_R2_CAPACITY_JSON }}
      STATE_GIT_REMOTE: origin
      STATE_REF: main
      THREADS_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_meta) && 'true' || secrets.THREADS_AUTO_PUBLISH }}
      INSTAGRAM_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_meta) && 'true' || secrets.INSTAGRAM_AUTO_PUBLISH }}
      LINKEDIN_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_linkedin) && 'true' || secrets.LINKEDIN_AUTO_PUBLISH }}
      INSTAGRAM_STORY_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_meta) && 'true' || secrets.INSTAGRAM_STORY_AUTO_PUBLISH }}
    steps:
      - name: Check out social-publisher state and source
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.STATE_REF }}
          fetch-depth: 0

      - name: Mask and export runtime workflow metadata
        run: node src/cli/mask-workflow-runtime.mjs --kind social

      - name: Use Node.js 20
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Decide whether scheduled work exists
        id: preflight
        env:
          DATA_MANIFEST_URL: ${{ secrets.DATA_MANIFEST_URL }}
        run: node src/cli/preflight.mjs --state state

      - name: Check out immutable data history
        if: steps.preflight.outputs.should_run == 'true'
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: openings-dev/data-pipeline
          ref: ${{ env.SOURCE_EVENT_COMMIT || 'main' }}
          path: dependencies/data-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatched source snapshot identity
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'repository_dispatch'
        run: >-
          node src/cli/verify-source-checkout.mjs
          --data "$DATA_PATH"
          --commit "$(git -C dependencies/data-pipeline rev-parse HEAD)"

      - name: Check out the canonical openings.dev wordmark
        if: steps.preflight.outputs.should_run == 'true'
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: openings-dev/web
          path: dependencies/web
          persist-credentials: false

      - name: Install CJK rendering fonts
        if: steps.preflight.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install --yes fonts-noto-cjk ffmpeg

      - name: Validate the manual gate before any write
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && env.RUN_MODE != 'dry-run'
        env:
          SOURCE_REF: ${{ github.ref_name }}
          REQUEST_JOB_ID: ${{ inputs.job_id }}
          REQUEST_JOB_IDS: ${{ inputs.job_ids }}
          REQUEST_STAGE: ${{ inputs.stage }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$SOURCE_REF" != "$STATE_REF" ]]; then
            echo 'Manual publication writes must run from the configured state branch.' >&2
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { parsePublicationRequest } from './src/cli/publish.mjs';
          import { parseMetaMigrationRequest } from './src/modules/publishing/meta-migration.mjs';
          if (process.env.RUN_MODE === 'migrate-meta') {
            parseMetaMigrationRequest({
              jobIds: (process.env.REQUEST_JOB_IDS || '').split(/[\s,]+/u).filter(Boolean),
              confirmation: process.env.REQUEST_CONFIRMATION || undefined,
            });
          } else {
            parsePublicationRequest({
              mode: process.env.RUN_MODE,
              jobId: process.env.REQUEST_JOB_ID || undefined,
              stage: process.env.REQUEST_STAGE || undefined,
              confirmation: process.env.REQUEST_CONFIRMATION || undefined,
            });
          }
          NODE

      - name: Configure state checkpoint Git identity
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Render a review artifact without external writes
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && (env.RUN_MODE == 'dry-run' || env.RUN_MODE == 'controlled')
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
        run: |
          arguments=(
            --data "$DATA_PATH"
            --state state
            --wordmark "$WEB_PATH/public/openings-wordmark-light.svg"
            --output .tmp/workflow-dry-run
          )
          if [[ -n "$REQUEST_JOB_ID" ]]; then
            arguments+=(--job "$REQUEST_JOB_ID")
          fi
          npm run dry-run -- "${arguments[@]}"

      - name: Upload the manual review artifact
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && (env.RUN_MODE == 'dry-run' || env.RUN_MODE == 'controlled')
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: social-review-${{ github.run_id }}
          path: .tmp/workflow-dry-run/jobs/**
          if-no-files-found: error
          retention-days: 3

      - name: Reset one failed stage without publishing
        if: steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'retry-stage'
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
          REQUEST_STAGE: ${{ inputs.stage }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          npm run publish --
          --mode retry-stage
          --job "$REQUEST_JOB_ID"
          --stage "$REQUEST_STAGE"
          --confirmation "$REQUEST_CONFIRMATION"
          --state state

      - name: Checkpoint Cloudflare Mastodon ownership before any provider request
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.PUBLISHING_MASTODON_ENABLED == 'true'
        run: |
          node src/cli/claim-platform-mastodon.mjs
          git add -- state/queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): claim Cloudflare Mastodon ownership [skip ci]'
          git push origin "HEAD:refs/heads/${STATE_REF}"

      - name: Publish at most one queued job
        id: publication
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled')
        env:
          STATE_GIT_CHECKPOINT_ENABLED: 'true'
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLISHING_CLIENT_SECRET: ${{ secrets.PUBLISHING_CLIENT_SECRET }}
          OPENINGS_R2_ACCESS_KEY_ID: ${{ secrets.OPENINGS_R2_ACCESS_KEY_ID }}
          OPENINGS_R2_SECRET_ACCESS_KEY: ${{ secrets.OPENINGS_R2_SECRET_ACCESS_KEY }}
          REQUEST_JOB_ID: ${{ inputs.job_id }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          mkdir -p .tmp
          arguments=(
            --mode "$RUN_MODE"
            --data "$DATA_PATH"
            --state state
            --wordmark "$WEB_PATH/public/openings-wordmark-light.svg"
            --output .tmp/publish
          )
          if [[ "$RUN_MODE" == 'controlled' ]]; then
            arguments+=(--job "$REQUEST_JOB_ID" --confirmation "$REQUEST_CONFIRMATION")
          fi
          npm run publish -- "${arguments[@]}" | tee .tmp/publication-summary.txt
          summary="$(tail -n 1 .tmp/publication-summary.txt)"
          outcome="$(node -e \
            'process.stdout.write(JSON.parse(process.argv[1]).outcome)' \
            "$summary")"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo '### Publication'
            echo '```json'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Replace legacy Instagram and Threads publications
        if: steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'migrate-meta'
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLISHING_CLIENT_SECRET: ${{ secrets.PUBLISHING_CLIENT_SECRET }}
          REQUEST_JOB_IDS: ${{ inputs.job_ids }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .tmp
          normalized_jobs="${REQUEST_JOB_IDS//,/ }"
          for job_id in $normalized_jobs; do
            npm run migrate:meta -- \
              --jobs "$job_id" \
              --confirmation "$REQUEST_CONFIRMATION" \
              --data "$DATA_PATH" \
              --state state \
              --wordmark "$WEB_PATH/public/openings-wordmark-light.svg" \
              --output ".tmp/meta-migration/$job_id" | tee ".tmp/meta-migration-$job_id.txt"
            {
              echo "### Meta migration: $job_id"
              echo '```json'
              tail -n 1 ".tmp/meta-migration-$job_id.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git add -- state/queue.json state/publications.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(state): migrate Meta publication $job_id [skip ci]"
              git push origin "HEAD:refs/heads/${STATE_REF}"
            fi
          done

      - name: Commit and push publication or reset state
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled' || env.RUN_MODE == 'retry-stage')
        run: |
          git add -- state/intake.json state/queue.json state/publications.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(state): record social publication [skip ci]'
          git push origin "HEAD:refs/heads/${STATE_REF}"

      - name: Prepare Instagram Story publication intent
        id: instagram_story_intent
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true'
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
        run: |
          arguments=(--mode intent --operation "$STORY_OPERATION_KEY" --state state)
          if [[ "$RUN_MODE" == 'controlled' ]]; then arguments+=(--job "$REQUEST_JOB_ID"); fi
          npm run publish:story -- "${arguments[@]}"

      - name: Commit and push Instagram Story intent
        if: always() && steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true' && steps.instagram_story_intent.outcome != 'skipped'
        run: |
          git add -- state/queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record Instagram Story intent [skip ci]'
          git push origin "HEAD:refs/heads/${STATE_REF}"

      - name: Publish Instagram Story for a completed feed post
        id: instagram_story
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true' && steps.instagram_story_intent.outcome == 'success'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          REQUEST_JOB_ID: ${{ inputs.job_id }}
        run: |
          arguments=(--mode publish --operation "$STORY_OPERATION_KEY" --state state)
          if [[ "$RUN_MODE" == 'controlled' ]]; then arguments+=(--job "$REQUEST_JOB_ID"); fi
          npm run publish:story -- "${arguments[@]}"

      - name: Commit and push Instagram Story state
        if: always() && steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true' && steps.instagram_story.outcome != 'skipped'
        run: |
          git add -- state/queue.json state/publications.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(state): record Instagram story [skip ci]'
          git push origin "HEAD:refs/heads/${STATE_REF}"

      - name: Process and checkpoint bounded snapshot intake
        id: intake
        if: steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'scheduled' && env.SOCIAL_AUTO_PUBLISH == 'true' && steps.publication.outputs.outcome != 'bridge_retryable'
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          PUBLISHING_CLIENT_SECRET: ${{ secrets.PUBLISHING_CLIENT_SECRET }}
        run: |
          mkdir -p .tmp
          echo 'error=' >> "$GITHUB_OUTPUT"
          for iteration in {1..4}; do
            npm run intake -- \
              --data "$DATA_PATH" \
              --state state \
              --wordmark "$WEB_PATH/public/openings-wordmark-light.svg" \
              --output ".tmp/intake-$iteration" | tee .tmp/intake-summary.txt
            summary="$(tail -n 1 .tmp/intake-summary.txt)"
            {
              echo "### Intake checkpoint $iteration"
              echo '```json'
              echo "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            git add -- state/intake.json state/queue.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(state): checkpoint social intake [skip ci]'
              if ! git push origin "HEAD:refs/heads/${STATE_REF}"; then
                git fetch origin "$STATE_REF"
                git rebase "origin/$STATE_REF"
                npm run validate
                git push origin "HEAD:refs/heads/${STATE_REF}"
              fi
            fi

            complete="$(node -e \
              'process.stdout.write(String(JSON.parse(process.argv[1]).complete === true))' \
              "$summary")"
            error="$(node -e \
              'process.stdout.write(JSON.parse(process.argv[1]).error ?? "")' \
              "$summary")"
            if [[ -n "$error" ]]; then
              echo "error=$error" >> "$GITHUB_OUTPUT"
              break
            fi
            if [[ "$complete" == 'true' ]]; then
              break
            fi
          done

      - name: Fail after preserving an intake error
        if: always() && steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'scheduled' && steps.intake.outputs.error != ''
        run: exit 1

      - name: Preserve deferred platform handoff and source media
        if: failure() && (env.PUBLISHING_SOCIAL_SHADOW_ENABLED == 'true' || env.PUBLISHING_MASTODON_ENABLED == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-recovery-${{ github.run_id }}
          path: |
            state/.publishing/
            .tmp/publish/.publishing/
            .tmp/publish/jobs/*/opengraph-image.png
            .tmp/intake-*/.publishing/
            .tmp/intake-*/jobs/*/opengraph-image.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
