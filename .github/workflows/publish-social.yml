name: Publish social jobs

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - controlled
          - migrate-meta
          - retry-stage
          - scheduled
      job_id:
        description: Explicit gh_ job ID for controlled publication or reset
        required: false
        type: string
      job_ids:
        description: Comma-separated gh_ job IDs for a Meta visual migration
        required: false
        type: string
      stage:
        description: Failed stage to reset
        required: false
        default: mastodon
        type: choice
        options:
          - bridge
          - intake-bridge
          - bluesky
          - mastodon
          - twitter
          - threads
          - instagram
          - linkedin
          - instagramStory
      confirmation:
        description: Enter PUBLISH_ONE_JOB, RESET_FAILED_STAGE, or MIGRATE_META_POSTS
        required: false
        type: string
      publish_meta:
        description: Include Instagram and Threads in this controlled publication only
        required: false
        default: false
        type: boolean
      publish_linkedin:
        description: Include LinkedIn in this controlled publication only
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: social-publisher-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Intake and publish one job
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      DATA_PATH: dependencies/data-pipeline
      WEB_PATH: dependencies/web
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://openings.dev' }}
      WEB_DEPLOY_REPOSITORY: ${{ vars.WEB_DEPLOY_REPOSITORY || 'openings-dev/web-deploy' }}
      BLUESKY_SERVICE_URL: ${{ vars.BLUESKY_SERVICE_URL || 'https://bsky.social' }}
      MASTODON_BASE_URL: ${{ vars.MASTODON_BASE_URL || 'https://mastodon.social' }}
      THREADS_API_URL: ${{ vars.THREADS_API_URL || 'https://graph.threads.net/v1.0' }}
      INSTAGRAM_API_ORIGIN: ${{ vars.INSTAGRAM_API_ORIGIN || 'https://graph.instagram.com' }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      LINKEDIN_API_ORIGIN: ${{ vars.LINKEDIN_API_ORIGIN || 'https://api.linkedin.com' }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
      LINKEDIN_ORGANIZATION_ID: ${{ vars.LINKEDIN_ORGANIZATION_ID }}
      LINKEDIN_PROVIDER: ${{ vars.LINKEDIN_PROVIDER || 'direct' }}
      BUFFER_API_ORIGIN: ${{ vars.BUFFER_API_ORIGIN || 'https://api.buffer.com' }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.BUFFER_LINKEDIN_CHANNEL_ID }}
      BUFFER_TWITTER_CHANNEL_ID: ${{ vars.BUFFER_TWITTER_CHANNEL_ID }}
      SOCIAL_AUTO_PUBLISH: ${{ vars.SOCIAL_AUTO_PUBLISH || 'false' }}
      THREADS_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_meta) && 'true' || vars.THREADS_AUTO_PUBLISH || 'false' }}
      INSTAGRAM_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_meta) && 'true' || vars.INSTAGRAM_AUTO_PUBLISH || 'false' }}
      LINKEDIN_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_linkedin) && 'true' || vars.LINKEDIN_AUTO_PUBLISH || 'false' }}
      INSTAGRAM_STORY_AUTO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'controlled' && inputs.publish_meta) && 'true' || vars.INSTAGRAM_STORY_AUTO_PUBLISH || 'false' }}
      STORY_OPERATION_KEY: job-story-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out social-publisher state and source
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide whether scheduled work exists
        id: preflight
        env:
          DATA_MANIFEST_URL: https://raw.githubusercontent.com/openings-dev/data-pipeline/main/snapshots/opportunities/api/manifest.json
        run: node src/cli/preflight.mjs --state state

      - name: Check out immutable data history
        if: steps.preflight.outputs.should_run == 'true'
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: openings-dev/data-pipeline
          path: dependencies/data-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the canonical openings.dev wordmark
        if: steps.preflight.outputs.should_run == 'true'
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: openings-dev/web
          path: dependencies/web
          persist-credentials: false

      - name: Use Node.js 20
        if: steps.preflight.outputs.should_run == 'true'
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install CJK rendering fonts
        if: steps.preflight.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install --yes fonts-noto-cjk ffmpeg

      - name: Install exact dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: npm ci

      - name: Validate the manual gate before any write
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && env.RUN_MODE != 'dry-run'
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
          REQUEST_JOB_IDS: ${{ inputs.job_ids }}
          REQUEST_STAGE: ${{ inputs.stage }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module - <<'NODE'
          import { parsePublicationRequest } from './src/cli/publish.mjs';
          import { parseMetaMigrationRequest } from './src/modules/publishing/meta-migration.mjs';
          if (process.env.RUN_MODE === 'migrate-meta') {
            parseMetaMigrationRequest({
              jobIds: (process.env.REQUEST_JOB_IDS || '').split(/[\s,]+/u).filter(Boolean),
              confirmation: process.env.REQUEST_CONFIRMATION || undefined,
            });
          } else {
            parsePublicationRequest({
              mode: process.env.RUN_MODE,
              jobId: process.env.REQUEST_JOB_ID || undefined,
              stage: process.env.REQUEST_STAGE || undefined,
              confirmation: process.env.REQUEST_CONFIRMATION || undefined,
            });
          }
          NODE

      - name: Render a review artifact without external writes
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && (env.RUN_MODE == 'dry-run' || env.RUN_MODE == 'controlled')
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
        run: |
          arguments=(
            --data "$DATA_PATH"
            --state state
            --wordmark "$WEB_PATH/public/openings-wordmark-light.svg"
            --output .tmp/workflow-dry-run
          )
          if [[ -n "$REQUEST_JOB_ID" ]]; then
            arguments+=(--job "$REQUEST_JOB_ID")
          fi
          npm run dry-run -- "${arguments[@]}"

      - name: Upload the manual review artifact
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && (env.RUN_MODE == 'dry-run' || env.RUN_MODE == 'controlled')
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: social-review-${{ github.run_id }}
          path: .tmp/workflow-dry-run/jobs/**
          if-no-files-found: error
          retention-days: 3

      - name: Reset one failed stage without publishing
        if: steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'retry-stage'
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
          REQUEST_STAGE: ${{ inputs.stage }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          npm run publish --
          --mode retry-stage
          --job "$REQUEST_JOB_ID"
          --stage "$REQUEST_STAGE"
          --confirmation "$REQUEST_CONFIRMATION"
          --state state

      - name: Publish at most one queued job
        id: publication
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled')
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          REQUEST_JOB_ID: ${{ inputs.job_id }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          mkdir -p .tmp
          arguments=(
            --mode "$RUN_MODE"
            --data "$DATA_PATH"
            --state state
            --wordmark "$WEB_PATH/public/openings-wordmark-light.svg"
            --output .tmp/publish
          )
          if [[ "$RUN_MODE" == 'controlled' ]]; then
            arguments+=(--job "$REQUEST_JOB_ID" --confirmation "$REQUEST_CONFIRMATION")
          fi
          npm run publish -- "${arguments[@]}" | tee .tmp/publication-summary.txt
          summary="$(tail -n 1 .tmp/publication-summary.txt)"
          outcome="$(node -e \
            'process.stdout.write(JSON.parse(process.argv[1]).outcome)' \
            "$summary")"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo '### Publication'
            echo '```json'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Replace legacy Instagram and Threads publications
        if: steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'migrate-meta'
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          REQUEST_JOB_IDS: ${{ inputs.job_ids }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .tmp
          normalized_jobs="${REQUEST_JOB_IDS//,/ }"
          for job_id in $normalized_jobs; do
            npm run migrate:meta -- \
              --jobs "$job_id" \
              --confirmation "$REQUEST_CONFIRMATION" \
              --data "$DATA_PATH" \
              --state state \
              --wordmark "$WEB_PATH/public/openings-wordmark-light.svg" \
              --output ".tmp/meta-migration/$job_id" | tee ".tmp/meta-migration-$job_id.txt"
            {
              echo "### Meta migration: $job_id"
              echo '```json'
              tail -n 1 ".tmp/meta-migration-$job_id.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git add -- state/queue.json state/publications.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(state): migrate Meta publication $job_id [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          done

      - name: Commit and push publication or reset state
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled' || env.RUN_MODE == 'retry-stage')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/intake.json state/queue.json state/publications.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(state): record social publication [skip ci]'
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          npm run validate
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Prepare Instagram Story publication intent
        id: instagram_story_intent
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true'
        env:
          REQUEST_JOB_ID: ${{ inputs.job_id }}
        run: |
          arguments=(--mode intent --operation "$STORY_OPERATION_KEY" --state state)
          if [[ "$RUN_MODE" == 'controlled' ]]; then arguments+=(--job "$REQUEST_JOB_ID"); fi
          npm run publish:story -- "${arguments[@]}"

      - name: Commit and push Instagram Story intent
        if: always() && steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true' && steps.instagram_story_intent.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(state): record Instagram Story intent [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish Instagram Story for a completed feed post
        id: instagram_story
        if: steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true' && steps.instagram_story_intent.outcome == 'success'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          REQUEST_JOB_ID: ${{ inputs.job_id }}
        run: |
          arguments=(--mode publish --operation "$STORY_OPERATION_KEY" --state state)
          if [[ "$RUN_MODE" == 'controlled' ]]; then arguments+=(--job "$REQUEST_JOB_ID"); fi
          npm run publish:story -- "${arguments[@]}"

      - name: Commit and push Instagram Story state
        if: always() && steps.preflight.outputs.should_run == 'true' && (env.RUN_MODE == 'scheduled' || env.RUN_MODE == 'controlled') && env.INSTAGRAM_STORY_AUTO_PUBLISH == 'true' && steps.instagram_story.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/queue.json state/publications.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(state): record Instagram story [skip ci]'
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          npm run validate
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Process and checkpoint bounded snapshot intake
        id: intake
        if: steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'scheduled' && env.SOCIAL_AUTO_PUBLISH == 'true' && steps.publication.outputs.outcome != 'bridge_retryable'
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .tmp
          echo 'error=' >> "$GITHUB_OUTPUT"
          for iteration in {1..4}; do
            npm run intake -- \
              --data "$DATA_PATH" \
              --state state \
              --wordmark "$WEB_PATH/public/openings-wordmark-light.svg" \
              --output ".tmp/intake-$iteration" | tee .tmp/intake-summary.txt
            summary="$(tail -n 1 .tmp/intake-summary.txt)"
            {
              echo "### Intake checkpoint $iteration"
              echo '```json'
              echo "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            git add -- state/intake.json state/queue.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(state): checkpoint social intake [skip ci]'
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                git fetch origin "$GITHUB_REF_NAME"
                git rebase "origin/$GITHUB_REF_NAME"
                npm run validate
                git push origin "HEAD:${GITHUB_REF_NAME}"
              fi
            fi

            complete="$(node -e \
              'process.stdout.write(String(JSON.parse(process.argv[1]).complete === true))' \
              "$summary")"
            error="$(node -e \
              'process.stdout.write(JSON.parse(process.argv[1]).error ?? "")' \
              "$summary")"
            if [[ -n "$error" ]]; then
              echo "error=$error" >> "$GITHUB_OUTPUT"
              break
            fi
            if [[ "$complete" == 'true' ]]; then
              break
            fi
          done

      - name: Fail after preserving an intake error
        if: always() && steps.preflight.outputs.should_run == 'true' && env.RUN_MODE == 'scheduled' && steps.intake.outputs.error != ''
        run: exit 1
